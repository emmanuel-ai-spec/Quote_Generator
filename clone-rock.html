<body>


   <h2 class="hd">Rock Paper Scissors</h2>
 <button class="rock"  onclick="
 playGame ('rock');
  "> 👊 </button>
  
  
  <button class="paper" onclick="
 playGame('paper');
  
  "> ✋ </button>
  <button class="scissors" onclick="
 playGame('scissors');
"> ✌️</button>
<p id="resut" class="js-result"></p>
<p id="moves" class="js-moves"></p>
<p class="js-score"></p>

<button class="reset" onclick="
score.Wins =0;
score.Losses = 0;
score.Ties = 0;
localStorage.removeItem('score')
updateScoreElement();
">Reset Score</button>






 
 <script>
    

   let score = JSON.parse(localStorage.getItem('score')) || {
    
      Wins : 0,
      Losses : 0,
      Ties : 0,
    };
   
  updateScoreElement();
   
   function playGame(playerMove) {
      const computerMove = ChooseComputerMove();
  console.log(computerMove);

  let result = '';
if (playerMove === 'scissors') {
  if (computerMove === 'rock') {
    result = 'you lose.';

  } else if (computerMove === 'paper') {
    result = 'you win.';
  } else if (computerMove === 'scissors') {
    result = 'Tie.';
  }

} else if (playerMove === 'paper') {
  if (computerMove === 'rock') {
    result = 'you win.';

  } else if (computerMove === 'paper') {
    result = 'Tie.';
  } else if (computerMove === 'scissors') {
    result = 'you lose.';
  }

} else if (playerMove === 'rock') {
if (computerMove === 'rock') {
    result = 'Tie.';

  } else if (computerMove === 'paper') {
    result = 'you lose.';
  } else if (computerMove === 'scissors') {
    result = 'you win.';
  }

}

if (result === 'you win.') {
  score.Wins += 1;
} else if (result === 'you lose.') {
  score.Losses += 1;
} else if (result === 'Tie.') {
  score.Ties += 1;
}


localStorage.setItem('score', JSON.stringify (score));

updateScoreElement();

document.querySelector('.js-result').innerHTML = result;

document.querySelector('.js-moves').innerHTML = `you ${playerMove} - ${computerMove}    Computer`;
  
/*alert( `You picked ${playerMove}. Computer picked ${computerMove}. ${result} Wins: ${score.Wins}, Losses: ${score.Losses}, Ties: ${score.Ties}`);
  */
}

 function updateScoreElement() {
document.querySelector('.js-score')
   .innerHTML = `Wins: ${score.Wins}, Losses: ${score.Losses}, Ties: ${score.Ties}`;
   
 }

    function ChooseComputerMove()
    {
  const randomNumber = Math.random();

   let computerMove = '';
  
  if (randomNumber >=0 && randomNumber < 1/3) {
    computerMove = 'rock';
  }
  else if (randomNumber >= 1/3 && randomNumber < 2/3) {
    computerMove = 'paper';
  }
  else if (randomNumber >= 2/3 && randomNumber < 1) {
    computerMove = 'scissors';
  }

  return computerMove;
    }
  </script>
