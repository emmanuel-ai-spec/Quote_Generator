<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button class="js-sub" onclick="
    subBtn();
    ">Subscribe</button>

  <script>
    function subBtn () {
    const subsribe = document.querySelector('.js-sub')

    if (subsribe.innerHTML === 'Subscribe') {
      subsribe.innerHTML = 'Subscribed';
    } else {
      subsribe.innerHTML = 'Subscribe';
    }
  }
  </script>
</body>
</html>
